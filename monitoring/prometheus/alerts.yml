groups:
  - name: dokkuchat
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_total{status=~"5.."}[5m])) / sum(rate(http_server_requests_total[5m])) > 0.02
        for: 5m
      - alert: CircuitBreakerOpen
        expr: max by (name) (circuit_breaker_state) == 2
        for: 2m
      - alert: DependencyDown
        expr: dependency_up == 0
        for: 1m
      - alert: IngestionBacklog
        expr: queue_jobs{queue="document-ingestion", state="waiting"} > 50
        for: 10m
      - alert: AnswersFindingNoContext
        expr: sum(rate(rag_retrievals_total{outcome="no_context"}[1h])) / sum(rate(rag_retrievals_total[1h])) > 0.5
        for: 30m
