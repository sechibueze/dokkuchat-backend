name: DokkuChat CI

on:
  push:
    branches: [development]
  workflow_dispatch: # re-run the build/deploy by hand from the Actions tab

permissions:
  contents: read

# Never cancel a run mid-push; queue newer ones instead.
concurrency:
  group: docker-development
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dokkuchat
      HEALTH_URL: http://127.0.0.1:18080/api/v1/health

    steps:
      - uses: actions/checkout@v4

      - name: Set image name and tag
        run: |
          echo "SHA_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "APP_IMAGE=${IMAGE}:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Compose reads .env automatically. These are random, per-run values used
      # only for the smoke test, never the real production secrets.
      - name: Create throwaway .env for the smoke test
        run: |
          {
            echo "NODE_ENV=production"
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Build image with Docker Compose
        run: docker compose build app

      # Compose names the built image "<project>-<service>" (dokkuchat-app) because
      # the app service has no `image:` key, so tag it with the name we push.
      - name: Tag built image
        run: |
          docker tag dokkuchat-app "${APP_IMAGE}"
          docker image inspect "${APP_IMAGE}" > /dev/null

      # The container command runs `prisma migrate deploy` before the app starts,
      # so this step also proves the migrations apply to a fresh Postgres.
      # --wait blocks until every service is healthy and fails if one is not.
      - name: Start stack with Docker Compose
        run: docker compose up -d --wait --wait-timeout 120 app

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "${HEALTH_URL}"; then
              echo; echo "App is up"; exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy"; exit 1

      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo "::group::docker compose ps"
          docker compose ps -a
          echo "::endgroup::"

          echo "::group::app healthcheck log"
          CID="$(docker compose ps -q app || true)"
          if [ -n "$CID" ]; then
            docker inspect --format '{{json .State.Health}}' "$CID" | jq
          fi
          echo "::endgroup::"

          echo "::group::compose logs"
          docker compose logs --no-color
          echo "::endgroup::"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker push "${IMAGE}:${SHA_TAG}"
          docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

      - name: Print image name
        run: |
          echo "Image pushed:"
          echo "  ${IMAGE}:${SHA_TAG}"
          echo "  ${IMAGE}:latest"
          {
            echo "### Docker image pushed"
            echo
            echo "- \`${IMAGE}:${SHA_TAG}\`"
            echo "- \`${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Deploy the exact image we just pushed. imgURL must be URL-encoded.
          IMG_URL=$(printf '%s' "docker.io/${IMAGE}:${SHA_TAG}" | jq -sRr @uri)
          echo "Asking Render to deploy docker.io/${IMAGE}:${SHA_TAG}"
          curl -fsS -o /dev/null -w "Render responded with HTTP %{http_code}\n" \
            "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMG_URL}"

      - name: Tear down
        if: always()
        run: docker compose down -v
