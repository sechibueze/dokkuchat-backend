global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus monitors itself
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # DokkuChat API
  - job_name: dokkuchat-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8080

rule_files:
  - alerts.yml
